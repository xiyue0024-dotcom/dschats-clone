# ============================================================
#  Fly.io 配置
#  第一次部署：
#    fly launch --no-deploy --copy-config
#    fly volumes create dschats_data --size 1 --region hkg
#    fly secrets set APP_SECRET=$(openssl rand -hex 32)
#    fly deploy
#
#  注意：
#  1. app 名在 Fly 上是全局唯一的，部署前改成你自己的，否则会冲突
#  2. 本应用是单进程 + 文件存储，必须 --ha=false，不能多机
# ============================================================

app = "dschats"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"

[[mounts]]
  source = "dschats_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
